name: Publish ODIR CAM review
on:
  push:
    branches: [main]
    paths:
      - 'docs/odir-cam/**'
      - '.github/workflows/odir-cam-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: odir-cam-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/odir-cam
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
